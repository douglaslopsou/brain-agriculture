version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brain-agriculture-db
    environment:
      POSTGRES_USER: brain_agriculture
      POSTGRES_PASSWORD: brain_agriculture
      POSTGRES_DB: brain_agriculture
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brain_agriculture']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
